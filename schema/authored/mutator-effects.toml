key = "spawn_life.enabled"
value = true

[[arena.sets]]
key = "spawn_life.value"
value = 100

[[arena.sets]]
key = "spawn_armor.enabled"
value = true

[[arena.sets]]
key = "spawn_armor.value"
value = 100

[[arena.sets]]
key = "spawn_delay.enabled"
value = true

[[arena.sets]]
key = "spawn_delay.base_seconds"
value = 0.5

[[arena.sets]]
key = "spawn_loadout"
value = "control baton and assault rifle"

[[arena.sets]]
key = "spawn_loadout_blue"
value = "cleared"
note = "Any separate blue team loadout is dropped, so both teams get the same thing."

[[arena.sets]]
key = "spawn_weapon.weapon_name"
