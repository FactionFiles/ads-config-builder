# What each mutator actually changes.
#
# Hand-written, because these effects live inside C++ function bodies in
# game_patch/multi/mutators.cpp and cannot be parsed reliably. Keys in `sets`
# are real config paths; anything with no config key to point at goes in
# `notes` instead. A set carries either a literal `value` or a `fromOption`
# naming the mutator option the value comes from. A stale entry here only makes a provenance popover
# under-explain - it never changes what gets written to the config file.

[meta]
apply_order_note = "When several mutators are on at once they are applied in a fixed order that does not depend on the order you list them in: Pogo, Dodging, Skiing, Low Gravity, Weird Gun Game, Humans vs. Bots, Jetpacks, Gibbing, Flaming Enemies, Big Craters, Super Rail, Delayed Supers, Armored, Super Drain, Vampire, Arena, One Weapon, Instagib, Score Limit Override, Ideal Player Count Override. Where two mutators touch the same setting, the later one in that list wins. Anything you set by hand in the same scope wins over every mutator."


# ============================================================================

["instagib"]
summary = "Rail gun only, with unlimited ammo and no reloading, and nothing to pick up."
help = "Against stock health a rail shot kills outright, so this plays as one hit, one kill. Players cannot switch away from the rail gun."
notes = [
  "Every pickup in the level is hidden: weapons, ammo, health, armor and powerups alike. Flags and other game type items are left alone.",
  "The rail gun never reloads and its ammo counter never goes down.",
  "Players cannot switch to any other weapon.",
]

[[instagib.sets]]
key = "spawn_loadout"
value = "rail gun only"

[[instagib.sets]]
key = "spawn_loadout_blue"
value = "cleared"
note = "Any separate blue team loadout is dropped, so both teams get the same thing."

[[instagib.sets]]
key = "spawn_weapon.weapon_name"
value = "rail_gun"
note = "Players spawn already holding the rail driver."

[[instagib.sets]]
key = "spawn_delay.enabled"
value = true

[[instagib.sets]]
key = "spawn_delay.base_seconds"
value = 0.5

[[instagib.sets]]
key = "infinite_reloads"
value = true

[[instagib.sets]]
key = "drop_weapons"
value = false


# ============================================================================

["oneweapon"]
summary = "Every weapon and ammo pickup in the level turns into the same one weapon, the rail gun by default."
help = "Players spawn with only the control baton and have to pick the featured weapon up. Unlike Instagib the featured weapon behaves normally: it reloads, it uses ammo, and players can switch between it and the baton."
notes = [
  "Weapon and ammo pickups are redirected to whatever the Weapon option is set to. The rail gun is the default.",
  "Every pickup that is not a weapon or ammo is hidden, so no health, armor or powerups.",
  "With Keep thrown explosives on, which is the default, remote charge and grenade pickups are left as they are.",
  "Only weapons that some pickup in the level can grant are offered in the Weapon list, otherwise players would be stuck with the baton.",
]

[[oneweapon.sets]]
key = "spawn_loadout"
value = "control baton only"

[[oneweapon.sets]]
key = "spawn_loadout_blue"
value = "cleared"
note = "Any separate blue team loadout is dropped, so both teams get the same thing."

[[oneweapon.sets]]
key = "spawn_weapon.weapon_name"
value = "Riot Stick"
note = "Players spawn holding the control baton."

[[oneweapon.sets]]
key = "spawn_delay.enabled"
value = true

[[oneweapon.sets]]
key = "spawn_delay.base_seconds"
value = 0.5

[[oneweapon.sets]]
key = "weapons_stay"
value = true


