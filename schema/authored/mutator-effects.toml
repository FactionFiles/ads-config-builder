["vampire"]
summary = "Damaging an enemy heals you for half the damage dealt."
help = "Full lifesteal heals for the full amount instead. Self damage and team damage do not heal."
notes = [
  "Healing is applied as effective health: health first, then armor, up to the normal maximum.",
  "With No health/armor pickups on (the default), Medical Kits, First Aid Kits and suit repairs are removed. This stacks with other mutators' pickup changes.",
]


# ============================================================================

["crits"]
summary = "Shots can land as critical hits for triple damage."
notes = [
  "Base crit chance is 2% for ranged weapons and 15% for melee. It rises with damage dealt in the last 20 seconds, up to 15% ranged and 45% melee at 800 damage.",
  "Crit shots glow in the shooter's team color, and the shooter's reticle flashes.",
  "Explosive crits have 25% larger blast radius and geomod craters.",
  "Players carrying a Damage Amp cannot crit. The Bagman carry buff is exempt.",
]


# ============================================================================

["superdrain"]
summary = "Health and armor above the normal maximum drain back down to it."
notes = [
  "Drains 1 health and 1 armor per second. The drain cannot kill.",
]


# ============================================================================

["armored"]
summary = "Players spawn with 100 armor."

[[armored.sets]]
key = "spawn_armor.enabled"
value = true

[[armored.sets]]
