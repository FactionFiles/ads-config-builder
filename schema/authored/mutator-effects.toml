["superrail"]
summary = "The Rail Driver pickup becomes a super item. It ignores weapon stay and respawns after 60 seconds."
notes = [
  "Has no effect if the loaded weapon tables have no Rail Driver.",
  "With Delayed Supers, the Rail Driver pickup is also delayed at map start.",
]

[[superrail.sets]]
key = "weapon_stay_exemptions"
value = "Rail Driver exempt from weapon stay"

[[superrail.sets]]
key = "item_respawn_time_overrides"
value = "Rail Driver respawns after 60 seconds"


