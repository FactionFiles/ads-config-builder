["bigcraters"]
summary = "Weapon explosions create geomod craters twice the normal size."
notes = [
  "Does not affect the driller.",
  "The server's geomod limit still applies and is reached sooner.",
]


# ============================================================================

["flamingenemies"]
summary = "Sustained Flamethrower fire sets players on fire."
help = "Burning deals damage every half second. Burn kills are credited to the player who set the fire."
notes = [
  "Ignites after 25 Flamethrower damage within one second. Other fire damage does not ignite.",
  "Teammates cannot be ignited.",
  "The burn ends 5 seconds after the last Flamethrower hit, or early on entering water, taking heavy explosive damage, taking a melee hit, or picking up a Medical Kit, First Aid Kit or Super Health.",
]


