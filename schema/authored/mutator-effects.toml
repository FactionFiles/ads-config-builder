note = "Replaces the spawn loadout."

[[oneweapon.sets]]
key = "spawn_loadout_blue"
value = []
note = "Removes the blue team loadout. Both teams use the same one."

[[oneweapon.sets]]
key = "spawn_weapon.weapon_name"
value = "Riot Stick"

[[oneweapon.sets]]
key = "spawn_delay.enabled"
value = true

[[oneweapon.sets]]
key = "spawn_delay.base_seconds"
