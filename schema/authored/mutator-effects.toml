["gibbing"]
summary = "Enables gibbing. Players killed by heavy overkill damage are gibbed."
help = "Same as enabling the Gibbing settings section. Its threshold and damage type settings still apply."

[[gibbing.sets]]
key = "gibbing.enabled"
value = true


# ============================================================================

["jetpacks"]
summary = "All players have a jetpack. Hold jump in the air to thrust upward."
notes = [
  "Fuel lasts about 5 seconds and fully recharges in about 7.5 seconds.",
  "An empty jetpack must recharge briefly before it can be used again.",
]


