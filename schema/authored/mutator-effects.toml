# What each mutator changes.
#
# Hand-written because these effects live in C++ function bodies in
# game_patch/multi/mutators.cpp and cannot be parsed reliably. Keys in `sets`
# are real config paths; effects with no config key go in `notes`. A set carries
# either a literal `value` or a `fromOption` naming the mutator option it comes
# from. A list `value` replaces the list setting outright, matching the source;
# an entry with no `ammo` gets the weapon's default reserve. A stale entry here
# only weakens the provenance popover - it never changes the written config.

[meta]
apply_order_note = "Mutators are applied in a fixed order, regardless of the order they are listed in: Pogo, Dodging, Skiing, Low Gravity, Weird Gun Game, Humans vs. Bots, Jetpacks, Gibbing, Flaming Enemies, Big Craters, Super Rail, Delayed Supers, Armored, Super Drain, Vampire, Critical Hits, Arena, One Weapon, Instagib, Score Limit Override, Ideal Player Count Override. When two mutators change the same setting, the later one wins. Settings set by hand in the same scope override all mutators."


# ============================================================================

["instagib"]
summary = "Rail Driver only, with infinite ammo and no reloading. All pickups are removed."
help = "A rail shot kills at stock health. Players cannot switch weapons."
notes = [
  "Hides all weapon, ammo, health, armor and powerup pickups. CTF flags and other game type items are kept.",
]

[[instagib.sets]]
key = "spawn_loadout"
value = [{ weapon_name = "rail_gun", ammo = 1 }]
note = "Replaces the spawn loadout."

[[instagib.sets]]
key = "spawn_loadout_blue"
value = []
note = "Removes the blue team loadout. Both teams use the same one."

[[instagib.sets]]
key = "spawn_weapon.weapon_name"
value = "rail_gun"

[[instagib.sets]]
key = "spawn_delay.enabled"
value = true

[[instagib.sets]]
key = "spawn_delay.base_seconds"
value = 0.5

[[instagib.sets]]
key = "infinite_reloads"
value = true

[[instagib.sets]]
key = "drop_weapons"
value = false


