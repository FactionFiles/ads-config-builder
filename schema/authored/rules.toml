# Plain-English labels for the game rules settings.
# One entry per path in schema/generated/rules.json "flat".
#
# unit  = the unit the value is written in inside the config file
# display = the unit to show the user, when it differs from the file unit
#
# Mode gating, for settings the server only reads in some game modes. Set at
# most one of them, and read the answer off the code that consumes the setting
# rather than off the key name:
#   modes    = the modes it works in
#   notModes = the modes it does nothing in, for when that list is the short one
#   teamOnly = true, for anything gated on the mode having teams
# The per-mode score limits and the rounds settings are gated by the generator
# instead, since Alpine states which modes those apply to itself.

# ---------------------------------------------------------------- the match

["game_type"]
page = "rules-mode"
label = "Game mode"
help = "The kind of game played on every map that does not pick its own; changing it resets that mode's own defaults, like the starting weapon and the respawn delay."

["mutators"]
page = "rules-mutators"
label = "Mutators"
help = "Ready-made bundles of rule changes, such as Instagib or Jetpacks, applied in a fixed order before anything you set by hand."

["time_limit"]
page = "rules-mode"
label = "Round length"
help = "How long a map runs before the next one loads."
unit = "seconds"
display = "minutes"
notModes = ["pit", "wo"]

["overtime"]
page = "rules-mode"
label = "Overtime"
help = "Keep playing past the time limit when the scores are tied."

["overtime.enabled"]
page = "rules-mode"
label = "Play overtime on a tie"
help = "When time runs out with the scores level, give both sides extra time to break the tie instead of ending the map."
notModes = ["run", "pit", "wo", "gg"]

["overtime.time"]
page = "rules-mode"
label = "Extra time"
help = "How much longer play continues once overtime starts."
unit = "minutes"
notModes = ["run", "pit", "wo", "gg"]

["overtime.tie_when_flag_stolen"]
page = "rules-mode"
label = "Treat a stolen flag as a tie"
help = "In Capture the Flag, go to overtime when a flag is being carried as time expires, even if one team is ahead."
modes = ["ctf", "sal"]

["overtime.tie_when_hill_contested"]
page = "rules-mode"
label = "Treat a contested hill as a tie"
help = "In King of the Hill, go to overtime when both teams are standing on the hill as time expires, even if one team is ahead."
modes = ["koth"]

["rounds"]
page = "rules-mode"
label = "Rounds"
help = "Settings for the modes that play several short rounds on one map instead of one continuous match."

["rounds.max_rounds"]
page = "rules-mode"
label = "Rounds per map"
help = "How many rounds are played before the server moves on to the next map."
unit = "rounds"

["rounds.round_time"]
page = "rules-mode"
label = "Length of each round"
help = "How long a single round runs before it is called; modes that end a round only on a team wipe ignore this."
unit = "seconds"

["rounds.post_round_time"]
page = "rules-mode"
label = "Celebration after a round"
help = "A short pause with the winner on screen before the next round is set up."
unit = "seconds"

["rounds.intermission_time"]
page = "rules-mode"
label = "Break between rounds"
help = "The countdown players wait through before the next round starts."
unit = "seconds"

# ---------------------------------------------------------------- score limits

["individual_kill_limit"]
page = "rules-mode"
label = "Kills to win"
help = "The first player to reach this many kills ends the map; used by Deathmatch and Wipeout."
unit = "kills"

["team_kill_limit"]
page = "rules-mode"
label = "Team kills to win"
help = "The first team to reach this many kills ends the map in Team Deathmatch."
unit = "kills"

["cap_limit"]
page = "rules-mode"
label = "Flag captures to win"
help = "The first team to bring the enemy flag home this many times ends the map in Capture the Flag."
unit = "captures"

["koth_score_limit"]
page = "rules-mode"
label = "Hill points to win"
help = "The first team to earn this many points from holding the hill ends the map in King of the Hill."
unit = "points"

["dc_score_limit"]
page = "rules-mode"
label = "Control points to win"
help = "The first team to earn this many points from holding control points ends the map in Damage Control."
unit = "points"

["pit_score_limit"]
page = "rules-mode"
label = "Duel wins to win"
help = "The first player to win this many duels ends the map in Pit."
unit = "wins"

["gg_score_limit"]
page = "rules-mode"
label = "Gun Game kills to win"
help = "How many kills a player needs to finish the weapon ladder and win in Gun Game."
unit = "kills"

["bag_score_limit"]
page = "rules-mode"
label = "Bag points to win"
help = "The first player to earn this many points from holding the bag ends the map in Bagman."
unit = "points"

["tbag_score_limit"]
page = "rules-mode"
label = "Team bag points to win"
help = "The first team to earn this many points from holding the bag ends the map in Team Bagman."
unit = "points"

["sal_cap_limit"]
page = "rules-mode"
label = "Salvage captures to win"
help = "The first team to bring the flag home this many times ends the map in Salvage."
unit = "captures"

# ---------------------------------------------------------------- objectives

["bag_return_time"]
page = "rules-mode"
label = "Dropped bag return time"
help = "How long a dropped bag lies on the ground in Bagman before it returns to its start point on its own."
unit = "seconds"
modes = ["bag", "tbag"]

["bag_spawn_delay"]
page = "rules-mode"
label = "Bag spawn delay"
help = "How long a fresh map runs in Bagman before the bag first appears, so nobody can grab it on the opening rush."
unit = "seconds"
modes = ["bag", "tbag"]

["sal_flag_spawn_delay"]
page = "rules-mode"
label = "Salvage flag spawn delay"
help = "How long a fresh map runs in Salvage before the flag first appears, so nobody can grab it on the opening rush."
unit = "seconds"
modes = ["sal"]

["sal_flag_capture_respawn_delay"]
page = "rules-mode"
label = "Salvage flag delay after a capture"
help = "How long the map waits before putting a new flag out once a team has scored in Salvage."
unit = "seconds"
modes = ["sal"]

["sal_flag_return_time"]
page = "rules-mode"
label = "Salvage dropped flag return time"
help = "How long a dropped flag lies on the ground in Salvage before it goes back to its start point."
unit = "seconds"
modes = ["sal"]

["flag_dropping"]
page = "rules-mode"
label = "Players can drop the flag"
help = "Lets a flag carrier hand the flag off deliberately instead of only losing it when killed."
modes = ["ctf", "sal"]

["flag_captures_while_stolen"]
page = "rules-mode"
label = "Capture while your own flag is missing"
help = "Lets a team score in Capture the Flag even while an enemy is carrying their flag, rather than having to get it back first."
modes = ["ctf"]

["flag_return_time"]
page = "rules-mode"
label = "Dropped flag return time"
help = "How long a dropped flag lies on the ground in Capture the Flag before it returns to base on its own."
unit = "seconds"
modes = ["ctf"]

["gg_rampage_rewards"]
page = "rules-mode"
label = "Reward Gun Game streaks"
help = "Give a random powerup to any player who climbs a whole weapon level without dying in Gun Game."
modes = ["gg"]

["gg_tiers"]
page = "rules-mode"
label = "Gun Game weapon ladder"
help = "The order weapons are handed out in Gun Game, as groups that are shuffled for each player; leave it empty to use the built-in ladder."
modes = ["gg"]

["gg_final_weapon"]
page = "rules-mode"
label = "Gun Game final weapon"
help = "The weapon a player has to get their last kill with to win Gun Game."
modes = ["gg"]

# ---------------------------------------------------------------- teams and population

["team_damage"]
page = "rules-mode"
label = "Teammates can hurt each other"
help = "Turn this on for a stricter game where a careless rocket costs your own side."
teamOnly = true

["balance_teams"]
page = "rules-mode"
label = "Put new players on the smaller team"
help = "Assigns anyone joining or changing team to whichever side has fewer players."
teamOnly = true

["auto_team_balance"]
page = "rules-mode"
label = "Even out the teams during a match"
help = "Moves a player across at the moment they die if the sides have drifted badly apart, instead of waiting for the next map."
teamOnly = true

["ideal_player_count"]
page = "rules-mode"
label = "Fill the server to this many players"
help = "Bots join until the server holds this many players and are sent away as real players arrive; set it to 32 to never remove bots."
unit = "players"

["saving_enabled"]
page = "rules-mode"
label = "Let players save and reload their position"
help = "Gives players the save and load chat commands, which is how Run courses are normally practiced."

# ---------------------------------------------------------------- mutators page

# (the mutators array itself is defined above, next to game_type)

# ---------------------------------------------------------------- spawning

["force_respawn"]
page = "rules-spawn"
label = "Respawn players automatically"
help = "Brings players back as soon as they are allowed to instead of leaving them on the death screen until they click."

["spawn_weapon"]
page = "rules-spawn"
label = "Starting weapon"
help = "The weapon a player is holding the moment they spawn."

["spawn_weapon.weapon_name"]
page = "rules-spawn"
label = "Weapon"
help = "Which weapon players are holding when they appear; each game mode picks its own unless you set one here."
notModes = ["gg"]

["spawn_weapon.clips"]
page = "rules-spawn"
label = "Spare clips"
help = "How many extra clips of ammunition the starting weapon comes with."
unit = "clips"
notModes = ["gg"]

["spawn_life"]
page = "rules-spawn"
label = "Starting health"
help = "Give players something other than the normal amount of health when they spawn."

["spawn_life.enabled"]
page = "rules-spawn"
label = "Set starting health"
help = "Leave this off to use the game's normal 100 health."

["spawn_life.value"]
page = "rules-spawn"
label = "Health on spawn"
help = "How much health players appear with; above 100 they start with an overheal that nothing else can top up."
unit = "points"

["spawn_armor"]
page = "rules-spawn"
label = "Starting armor"
help = "Give players some armor when they spawn instead of none."

["spawn_armor.enabled"]
page = "rules-spawn"
label = "Set starting armor"
help = "Leave this off to have players spawn with no armor, as the game normally does."

["spawn_armor.value"]
page = "rules-spawn"
label = "Armor on spawn"
help = "How much armor players appear with."
unit = "points"

["spawn_delay"]
page = "rules-spawn"
label = "Wait before respawning"
help = "A short delay after dying before the player can come back."

["spawn_delay.enabled"]
page = "rules-spawn"
label = "Make players wait to respawn"
help = "Slows the game down and gives the person who got the kill a moment of breathing room."

["spawn_delay.base_seconds"]
page = "rules-spawn"
label = "How long to wait"
help = "The delay after dying; in Wipeout this grows with each death a player takes in the round."
unit = "seconds"

["spawn_protection"]
page = "rules-spawn"
label = "Spawn protection"
help = "Brief invulnerability so players cannot be killed the instant they appear."

["spawn_protection.enabled"]
page = "rules-spawn"
label = "Protect players as they appear"
help = "Stops spawn camping from being a guaranteed kill."

["spawn_protection.duration"]
page = "rules-spawn"
label = "How long it lasts"
help = "The window of invulnerability after appearing; protection ends early if the player fires."
unit = "seconds"

["spawn_protection.use_powerup"]
page = "rules-spawn"
label = "Show it as an invulnerability powerup"
help = "Gives players the visible powerup effect other people can see, rather than the silent protection the stock game uses."

["spawn_selection"]
page = "rules-spawn"
label = "Where players appear"
help = "How the server picks which of a map's spawn points to use."

["spawn_selection.respect_team_spawns"]
page = "rules-spawn"
label = "Use each team's own spawn points"
help = "Keeps teams in their own half of a map; turning it off lets anyone appear anywhere, which suits small maps."
teamOnly = true

["spawn_selection.try_avoid_players"]
page = "rules-spawn"
label = "Prefer spawns away from other players"
help = "Weights the random pick toward emptier parts of the map instead of choosing completely at random."

["spawn_selection.always_avoid_last"]
page = "rules-spawn"
label = "Never reuse a player's last spawn"
help = "Stops a player being put back in exactly the place they just died."

["spawn_selection.always_use_furthest"]
page = "rules-spawn"
label = "Always use the furthest spawn"
help = "Removes the randomness entirely and always picks the point furthest from anyone else, which makes spawns predictable."

["spawn_selection.only_avoid_enemies"]
page = "rules-spawn"
label = "Only stay away from enemies"
help = "Lets players spawn right next to teammates, so a squad can regroup, while still avoiding the other side."
teamOnly = true

["spawn_selection.dynamic_respawns"]
page = "rules-spawn"
label = "Add spawn points at item pickups"
help = "Helps maps that were built for a handful of players cope with a full server by treating item locations as extra spawn points."

["spawn_selection.dynamic_respawn_items"]
page = "rules-spawn"
label = "Items that create spawn points"
help = "Which pickups get turned into extra spawn points, and how few real spawn points a map has to have before each one counts."

["spawn_loadout"]
page = "rules-spawn"
label = "Everything players spawn with"
help = "The full list of weapons and ammunition handed out on spawn; leave it alone to use the game mode's normal kit."
notModes = ["gg"]

["spawn_loadout_blue"]
page = "rules-spawn"
label = "Blue team spawn kit"
help = "A different set of weapons for the blue team only, for asymmetric attack and defense games."
teamOnly = true

["force_character"]
page = "rules-spawn"
label = "Forced character"
help = "Make everyone play as the same character model instead of their own choice."

["force_character.enabled"]
page = "rules-spawn"
label = "Force one character for everyone"
help = "Useful when custom player models make people hard to see or tell apart."

["force_character.character"]
page = "rules-spawn"
label = "Character"
help = "The character model everyone plays as."

# ---------------------------------------------------------------- weapons and items

["weapons_stay"]
page = "rules-weapons"
label = "Weapons stay after being picked up"
help = "Leaves weapon pickups on the map for the next person instead of making everyone wait for a respawn."
notModes = ["gg"]

["weapon_stay_exemptions"]
page = "rules-weapons"
label = "Weapons that do not stay"
help = "Weapons listed here still disappear when taken, which is the usual way to stop everyone carrying the strongest gun at once."
notModes = ["gg"]

["drop_weapons"]
page = "rules-weapons"
label = "Players drop their weapon when killed"
help = "Leaves the dead player's weapon on the ground for someone else to take."
notModes = ["gg"]

["drop_amps"]
page = "rules-weapons"
label = "Players drop their damage amp when killed"
help = "Passes the damage amplifier on to whoever can grab it rather than losing it until the next respawn."
notModes = ["bag", "tbag"]

["weapon_pickups_give_full_ammo"]
page = "rules-weapons"
label = "Weapon pickups give full ammo"
help = "A weapon you already own tops you all the way up instead of giving just one clip."
notModes = ["gg"]

["infinite_reloads"]
page = "rules-weapons"
label = "Reloading never uses up ammo"
help = "Players can always reload, so they never run dry, but still have to stop and do it."
notModes = ["gg"]

["force_rail_reload"]
page = "rules-weapons"
label = "Rail gun must finish reloading"
help = "Stops players cancelling the rail gun's long reload by switching weapons and switching straight back."

["item_replacements"]
page = "rules-weapons"
label = "Replace items around the map"
help = "Swap one pickup for another everywhere it appears, for example turning every medkit into armor; leave the replacement blank to remove the item entirely."
notModes = ["gg"]

["item_respawn_time_overrides"]
page = "rules-weapons"
label = "Change how fast items come back"
help = "Override the respawn time of individual pickups, usually to slow down the strongest ones."
notModes = ["gg"]

["delayed_items"]
page = "rules-weapons"
label = "Items that are not there at the start"
help = "These pickups are hidden when a map loads and only appear after their first respawn time has passed, so nobody can rush them."
notModes = ["gg"]

# ---------------------------------------------------------------- damage and physics

["fall_damage"]
page = "rules-damage"
label = "Fall damage"
help = "Hurt players who drop too far, as the single-player game does."

["pvp_damage_modifier"]
page = "rules-damage"
label = "Damage multiplier between players"
help = "1 is normal; higher numbers make everyone die faster, and 0 means players cannot hurt each other at all."
unit = "multiplier"

["no_player_collide"]
page = "rules-damage"
label = "Players can walk through each other"
help = "Stops teammates blocking doorways, at the cost of not being able to body-block an enemy."

["geo_limit"]
page = "rules-damage"
label = "How much of the map can be destroyed"
help = "The number of holes players can blow in the level before the oldest ones repair themselves."
unit = "craters"

["rf2_geo_limit"]
page = "rules-damage"
label = "Brush-based destruction limit"
help = "A separate limit for the newer whole-chunk destruction, which only a few maps are built to use; -1 means no limit and 0 turns it off."
unit = "craters"

["geo_chunk_physics"]
page = "rules-damage"
label = "Blasted chunks fall away"
help = "Lets pieces of the map that get cut loose drop under gravity instead of hanging in the air."

["clear_stale_movement_input"]
page = "rules-damage"
label = "Ignore keys held while a map loads"
help = "Stops players sliding off on their own at the start of a map because they were holding a key during the loading screen."

["gibbing"]
page = "rules-damage"
label = "Gibbing"
help = "Blow bodies apart when a killing blow is heavy enough."

["gibbing.enabled"]
page = "rules-damage"
label = "Players can be gibbed"
help = "Off by default, matching the stock game; turn it on for a gorier look."

["gibbing.damage_threshold"]
page = "rules-damage"
label = "Damage needed to gib"
help = "How big a single hit has to be to blow the body apart rather than just kill it."
unit = "damage"

["gibbing.all_damage_types"]
page = "rules-damage"
label = "Any kind of damage can gib"
help = "Lets bullets and melee gib as well as explosions."

["kill_rewards"]
page = "rules-damage"
label = "Rewards for a kill"
help = "Health and armor handed to a player for getting a kill, which keeps the fighting moving on maps with few pickups."

["kill_rewards.health"]
page = "rules-damage"
label = "Health for a kill"
help = "Health given to the killer; leave it at zero for none."
unit = "points"

["kill_rewards.armor"]
page = "rules-damage"
label = "Armor for a kill"
help = "Armor given to the killer; leave it at zero for none."
unit = "points"

["kill_rewards.effective_health"]
page = "rules-damage"
label = "Combined reward for a kill"
help = "Tops the killer's health up first and puts whatever is left over into armor, so the reward is never wasted."
unit = "points"

["kill_rewards.health_is_super"]
page = "rules-damage"
label = "Health reward can overheal"
help = "Lets the reward push a player past normal health, up to 200, the way a super health pickup does."

["kill_rewards.armor_is_super"]
page = "rules-damage"
label = "Armor reward can go past normal"
help = "Lets the reward push a player past normal armor, up to 200, the way a super armor pickup does."

["critical_hits"]
page = "rules-damage"
label = "Critical hits"
help = "Give shots a chance to land as a critical, which briefly grants the shooter a damage amplifier."

["critical_hits.enabled"]
page = "rules-damage"
label = "Shots can land as criticals"
help = "Adds a bit of luck and a reward for staying alive; off by default."

["critical_hits.reward_duration"]
page = "rules-damage"
label = "How long the amp lasts"
help = "The damage amplifier a critical hit grants, which stacks if the player crits again before it expires."
unit = "milliseconds"
display = "seconds"

["critical_hits.base_chance"]
page = "rules-damage"
label = "Chance of a critical hit"
help = "How often a shot crits before any bonus is added."
unit = "fraction"
display = "percent"

["critical_hits.dynamic_scale"]
page = "rules-damage"
label = "Raise the chance as a player deals damage"
help = "Adds up to ten more percentage points of crit chance the longer a player survives and keeps hitting people, resetting when they die."

["critical_hits.dynamic_damage_bonus_ceiling"]
page = "rules-damage"
label = "Damage needed for the full bonus"
help = "How much damage a player has to deal on one life to reach the largest crit chance bonus; lower numbers make the bonus arrive sooner."
unit = "damage"

# ---------------------------------------------------------------- messages

["welcome_message"]
page = "rules-msg"
label = "Welcome message"
help = "A line of text shown to each player when they join."

["welcome_message.enabled"]
page = "rules-msg"
label = "Greet players when they join"
help = "Good for pointing people at your rules, your Discord, or how to vote."

["welcome_message.text"]
page = "rules-msg"
label = "Message"
help = "What each player is told when they arrive; anything past 240 characters is cut off."

["location_pinging"]
page = "rules-msg"
label = "Players can ping locations"
help = "Lets a player mark a spot on the map for their team to see, which only works in team modes and in Run."
notModes = ["dm", "bag", "pit", "gg"]
