# Labels for the game rules settings.
# One entry per path in schema/generated/rules.json "flat".
#
# basic = true shows the setting while advanced settings are hidden; anything
#   unmarked is advanced
# unit    = the unit the value is stored in inside the config file
# display = the unit to show the user, when it differs from the file unit
#
# Mode gating, for settings the server only reads in some game types. Set at
# most one, and take the answer from the code that consumes the setting, not the
# key name:
#   modes    = the game types it works in
#   notModes = the game types it does nothing in, when that list is shorter
#   teamOnly = true, for anything gated on the game type having teams
# The per-mode score limits and the rounds settings are gated by the generator,
# since Alpine states which modes those apply to itself.

# ---------------------------------------------------------------- the match

["game_type"]
page = "rules-mode"
basic = true
label = "Game type"
help = "Used on every map that does not set its own. Changing it applies that game type's defaults, such as the spawn weapon and spawn delay."

["mutators"]
page = "rules-mutators"
basic = true
label = "Mutators"
help = "Preset rule changes, such as Instagib or Jetpacks. Applied in a fixed order before any settings you change by hand."

["time_limit"]
page = "rules-mode"
basic = true
label = "Time limit"
help = "How long each map lasts."
unit = "seconds"
display = "minutes"
notModes = ["pit", "wo"]

["overtime"]
page = "rules-mode"
label = "Overtime"
help = "Extends the map past the time limit when the score is tied."

["overtime.enabled"]
page = "rules-mode"
label = "Overtime"
notModes = ["run", "pit", "wo", "gg"]

["overtime.time"]
page = "rules-mode"
label = "Overtime length"
unit = "minutes"
notModes = ["run", "pit", "wo", "gg"]

["overtime.tie_when_flag_stolen"]
page = "rules-mode"
label = "Stolen flag counts as a tie"
help = "Goes to overtime if a flag is being carried when time runs out, even if one team is ahead."
modes = ["ctf", "sal"]

["overtime.tie_when_hill_contested"]
page = "rules-mode"
label = "Contested hill counts as a tie"
help = "Goes to overtime if both teams are on the hill when time runs out, even if one team is ahead."
modes = ["koth"]

["rounds"]
page = "rules-mode"
label = "Rounds"
help = "For game types that play several rounds per map."

["rounds.max_rounds"]
page = "rules-mode"
basic = true
label = "Rounds per map"
unit = "rounds"

["rounds.round_time"]
page = "rules-mode"
label = "Round time limit"
help = "Ignored by game types where a round only ends when a team is eliminated."
unit = "seconds"

["rounds.post_round_time"]
page = "rules-mode"
label = "Post-round celebration"
help = "Time the winner is shown before the next round is set up."
unit = "seconds"

["rounds.intermission_time"]
page = "rules-mode"
label = "Intermission between rounds"
help = "Countdown before the next round starts."
unit = "seconds"

