["alpine_restrict.advertise_alpine"]
page = "srv-access"
label = "Advertise Alpine Faction"
help = "Shows the server as an Alpine Faction server in the server browser."

["alpine_restrict.only_welcome_alpine"]
page = "srv-access"
label = "Only welcome Alpine players"
help = "Players not using Alpine Faction can still join, but are told the server is meant for Alpine Faction."

["alpine_restrict.clients_require_alpine"]
page = "srv-access"
basic = true
label = "Require Alpine Faction"
help = "Needed for features the original game does not support, such as mutators."

["alpine_restrict.reject_non_alpine_clients"]
page = "srv-access"
label = "Reject non-Alpine clients"
help = "Refuses connections from players not using Alpine Faction."

["alpine_restrict.alpine_require_release_build"]
page = "srv-access"
label = "Require release build"
help = "Refuses connections from development builds of Alpine Faction."

["alpine_restrict.require_d3d11"]
page = "srv-access"
label = "Require Direct3D 11 renderer"

