# labels for the server settings.
# covers every path in schema/generated/server.json "flat", plus the rcon profile
# array, the per-level keys and the bot profile keys.
#
# namespaced keys for tables that are not part of "flat":
#   levels.*        keys allowed inside a [[levels]] entry
#   bot_profiles.*  keys allowed inside a bot profile file
#
# basic = true shows the setting while advanced settings are hidden; anything
#   unmarked is advanced
# unit  = the unit the value is written in inside the config file
# display = the unit to show the user, when it differs from the file unit

# ---------------------------------------------------------------- name and players

["ads_version"]
page = "srv-basics"
label = "Config file version"
help = "Set automatically. Does not need to be changed."

["server_name"]
page = "srv-basics"
basic = true
label = "Server name"
help = "Name shown in the server browser."

["max_players"]
page = "srv-basics"
basic = true
label = "Max players"
help = "Up to 32."
unit = "players"

["upnp"]
page = "srv-basics"
basic = true
label = "Enable UPnP"
help = "Attempts to forward the server port automatically on routers that support UPnP."

["fflink_gsk"]
page = "srv-stats"
basic = true
label = "FactionFiles Game Server Key"
help = "Enables stats tracking on FactionFiles. Leave blank to disable."
link = "https://www.factionfiles.com/ff.php?action=manageservers"
linkLabel = "Register a key on FactionFiles"

# ---------------------------------------------------------------- passwords and access

["password"]
page = "srv-access"
basic = true
label = "Join password"
help = "Leave blank for a public server."

["rcon_password"]
