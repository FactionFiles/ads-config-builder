["rcon_profiles.allow_multiple"]
page = "admin"
label = "Allow multiple users"
help = "Lets more than one person use this profile at the same time."

["rcon_profiles.allowed_commands"]
page = "admin"
label = "Allowed commands"

# command names come from the rcon master list in the Alpine source; anything
# not on that list is refused.
["rcon_profiles.allowed_commands".choiceLabels]
info = "Show server info"
say = "Send a chat message as the server"
kick = "Kick a player"
ban = "Ban a player"
ban_ip = "Ban an IP address"
unban_last = "Undo the most recent ban"
level = "Load a map"
map = "Load a map (alias of level)"
map_ext = "Extend the current map"
map_rest = "Restart the current map"
map_next = "Go to the next map"
map_rand = "Go to a random map in the rotation"
map_prev = "Go to the previous map"
maxfps = "Set the server FPS cap"
sv_caplimit = "Set the capture limit"
sv_fraglimit = "Set the frag limit"
sv_gametype = "Set the game type, optionally with a map"
sv_netfps = "Set the server network update rate"
gt = "Set the game type (alias of sv_gametype)"
sv_geolimit = "Set the geomod limit"
sv_pass = "Set the join password"
sv_timelimit = "Set the time limit"
download_level = "Download a map from FactionFiles"
sv_loadconfig = "Reload the server config"

# alpine checks the command name as typed, so an alias is granted with its command
["rcon_profiles.allowed_commands".aliases]
map = "level"
gt = "sv_gametype"

# ---------------------------------------------------------------- base rules

["base"]
page = "rules-mode"
label = "Base rules"
help = "Rules used by every map unless the map overrides them."

# ---------------------------------------------------------------- demos

["demo_auto_record"]
page = "srv-demos"
basic = true
label = "Auto record demos"
help = "Records each map to a demo file in the demos folder. Demos are discarded if no players were connected, and on match servers only live matches are recorded."

["demo_chat_record"]
page = "srv-demos"
basic = true
label = "Record chat"
help = "Includes chat messages in demos."

["fflink_demo_upload"]
page = "srv-demos"
basic = true
label = "Upload demos to FactionFiles"
help = "Uploads each auto-recorded demo and links it to the match on FactionFiles. Requires a Game Server Key."

["fflink_demo_max_mb"]
page = "srv-demos"
label = "Max upload size"
help = "Larger demos are kept on the server but not uploaded."
unit = "megabytes"

["fflink_demo_queue_max"]
page = "srv-demos"
label = "Upload queue size"
help = "Max demos waiting to upload. When full, the oldest is dropped from the queue."
unit = "recordings"

["fflink_demo_delete_after_send"]
page = "srv-demos"
label = "Delete demos after upload"
help = "Deletes the local file after a successful upload."
