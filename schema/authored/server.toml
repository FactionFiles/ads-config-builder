label = "Rcon password"
help = "Grants access to admin commands. For multiple passwords with different permissions, see Advanced admin access."

["require_client_mod"]
page = "srv-access"
label = "Require client mod"
help = "Requires players to have the server's TC mod installed. Only applies when running a TC mod."

["alpine_restrict"]
page = "srv-access"
